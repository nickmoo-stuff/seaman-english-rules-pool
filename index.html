<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="seamen:app-version" content="1.0.1"><meta name="seamen:build-number" content="1596"><meta name="theme-color" content="#24140c"><title>Seamen English Rules Pool</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Seamen Pool"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#24140c;color:#f5ead2;font:18px/1.6 Georgia,serif;min-height:100vh;display:grid;place-items:center}main{max-width:36rem;margin:1rem;padding:2rem;border:1px solid #a58240;border-radius:14px;background:#18100b}h1{color:#e5c67d;font-size:1.8rem}button,a{font:inherit;color:#f5ead2}button{background:#45301c;border:1px solid #b58a45;border-radius:8px;padding:.65rem 1rem;min-height:44px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #f1cf83;outline-offset:4px}[hidden]{display:none!important}.loading-dots{display:inline-block;width:3ch;white-space:nowrap;overflow:hidden;vertical-align:bottom;animation:seamen-dots 1.5s steps(4,end) infinite}@keyframes seamen-dots{0%{width:0}100%{width:3ch}}@media(prefers-reduced-motion:reduce){.loading-dots{animation:none;width:3ch}}</style></head>
<body><main><h1>Seamen English Rules Pool</h1><p id="status" role="status">Preparing the complete game for play and offline use<span class="loading-dots" aria-hidden="true">...</span></p><button id="retry" hidden>Try again</button> <button id="previous" hidden>Play previous cached version</button><p id="fallback" hidden><a href="releases/v1.0.1-b1596-qa2/">Continue to the browser game</a></p><noscript>Enable JavaScript to play Seamen Pool.</noscript></main>
<script>
(async()=>{
 const root=new URL('./',location.href),build='v1.0.1-b1596-qa2',status=document.getElementById('status');
 document.getElementById('retry').onclick=()=>location.reload();
 async function previous(){
  for(const name of (await caches.keys()).reverse()){
   if(!name.startsWith('seamen-'))continue;
   const cache=await caches.open(name);
   // Navigate to the cached document so relative scripts/images keep their release base.
   for(const request of await cache.keys()){
    const url=new URL(request.url);
    if(url.origin!==root.origin||!url.pathname.startsWith(root.pathname)||!url.pathname.endsWith('/index.html'))continue;
    const response=await cache.match(request);if(!response)continue;
    const html=await response.text();
    if(!html.includes('game.js')||html.includes('Play previous cached version'))continue;
    location.replace(url);return;
   }
  }
  status.textContent='No complete previous game was found. Reconnect and try again; your saved progress has not been changed.';
 }
 document.getElementById('previous').onclick=()=>previous().catch(()=>{status.textContent='The previous game could not be opened. Reconnect and try again. Your saved progress has not been changed.';});
 if(!('serviceWorker' in navigator)){location.replace(new URL('releases/'+build+'/',root));return;}
 // Do not boot versioned code through an old network-first worker. The new
 // worker confirms its completely verified build before this entry navigates.
 const isReady=worker=>new Promise(resolve=>{
  if(!worker){resolve(false);return;}
  const channel=new MessageChannel(),timer=setTimeout(()=>{channel.port1.close();resolve(false);},700);
  channel.port1.onmessage=e=>{clearTimeout(timer);channel.port1.close();resolve(e.data?.build===build);};
  worker.postMessage({type:'SEAMEN_BUILD'},[channel.port2]);
 });
 let registration,changed;
 const timeout=new Promise((_,reject)=>{changed=setTimeout(()=>reject(Error('install_timeout')),90000);});
 try{
  await Promise.race([(async()=>{
   if(await isReady(navigator.serviceWorker.controller))return;
   registration=await navigator.serviceWorker.register(new URL('service-worker.js',root),{scope:root.pathname,updateViaCache:'none'});
   // An already installed complete build works offline without an update fetch.
   if(!await isReady(navigator.serviceWorker.controller)){
    await new Promise((resolve,reject)=>{
     const inspect=async()=>{if(await isReady(navigator.serviceWorker.controller)){cleanup();resolve();return;}const waiting=registration.waiting;if(waiting&&await isReady(waiting))waiting.postMessage({type:'SEAMEN_ACTIVATE'});};
     const cleanup=()=>navigator.serviceWorker.removeEventListener('controllerchange',inspect);
     navigator.serviceWorker.addEventListener('controllerchange',inspect);inspect();
     const watch=worker=>worker?.addEventListener('statechange',()=>{if(worker.state==='redundant'){cleanup();reject(Error('incomplete_build'));}else inspect();});
     watch(registration.installing);registration.addEventListener('updatefound',()=>watch(registration.installing));
     registration.update().catch(error=>{cleanup();reject(error);});
    });
   }
  })(),timeout]);
  clearTimeout(changed);location.replace(new URL('releases/'+build+'/',root));
 }catch(error){
  clearTimeout(changed);status.textContent='The complete update could not be prepared. Reconnect and try again, or open your previous cached game. Your saved progress has not been changed.';
  document.getElementById('retry').hidden=false;document.getElementById('previous').hidden=false;
  // A failed integrity check must never fall through to an unverified online build.
  document.getElementById('fallback').hidden=true;
 }
})();
</script></body></html>
